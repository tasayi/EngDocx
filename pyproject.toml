[project]
name = "engdoc"
version = "0.1.0"
description = "Engineering Document Authoring and Publishing System"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "EngDoc Development Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "lxml>=5.2.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pypandoc-binary>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
engdoc = "engdoc.api.app:main"
engdoc-doctor = "engdoc.core.diagnostics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engdoc"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
