<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    Satellite Thermal Sensor Telemetry Bus Architecture
  </text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Subsystem Reference: ENG-TCS-2026-DIAG
  </text>

  <!-- Central Processing Unit (OBC / RTU) -->
  <rect x="50" y="140" width="160" height="150" rx="8" fill="url(#boxGrad)" stroke="#60a5fa" stroke-width="2"/>
  <text x="130" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Thermal RTU</text>
  <text x="130" y="220" font-family="Arial, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">24-Bit Σ-Δ ADC</text>
  <text x="130" y="240" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">CAN / RS-422</text>

  <!-- Bus Spine -->
  <line x1="210" y1="215" x2="310" y2="215" stroke="#38bdf8" stroke-width="4"/>
  <line x1="310" y1="120" x2="310" y2="310" stroke="#38bdf8" stroke-width="4"/>

  <!-- Node 1: Solar Array Wing -->
  <line x1="310" y1="120" x2="400" y2="120" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4"/>
  <rect x="400" y="85" width="160" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="480" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Solar Array Thermistors</text>
  <text x="480" y="135" font-family="Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">RTD Pt1000 (x8)</text>

  <!-- Node 2: Battery Radiator Panel -->
  <line x1="310" y1="215" x2="400" y2="215" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4"/>
  <rect x="400" y="180" width="160" height="70" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="480" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Battery Baseplate</text>
  <text x="480" y="230" font-family="Arial, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">NTC 10k Thermistors (x4)</text>

  <!-- Node 3: Propulsion Tank Heaters -->
  <line x1="310" y1="310" x2="400" y2="310" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4"/>
  <rect x="400" y="275" width="160" height="70" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Propulsion Tank</text>
  <text x="480" y="325" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Dual Active Heaters (x2)</text>

  <!-- Right Spine to Flight Computer -->
  <line x1="560" y1="120" x2="630" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="560" y1="215" x2="630" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <line x1="560" y1="310" x2="630" y2="310" stroke="#94a3b8" stroke-width="2"/>

  <!-- Telemetry Concentrator -->
  <rect x="630" y="110" width="120" height="180" rx="6" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <text x="690" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Telemetry</text>
  <text x="690" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Packetizer</text>
  <text x="690" y="245" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">10 Hz CCSDS</text>
</svg>